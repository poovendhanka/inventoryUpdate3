# Server Configuration
server.port=8085

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tester
spring.datasource.username=postgres
spring.datasource.password=Falcon@4
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# Changed to 'validate' to prevent Hibernate from auto-updating schema
# Use Flyway migrations for schema changes instead
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Flyway Configuration - Enable Flyway for proper schema migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# Temporarily enable repair to fix migration history (can remove after first successful run)
spring.flyway.repair-on-migrate=true
# Temporarily disable validation to allow checksum repair (remove after first successful run)
spring.flyway.validate-on-migrate=false
